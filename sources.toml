# =============================================================================
# research-feed-bot source catalogue
# =============================================================================
#
# Every [[source]] gets its own Discord channel (one webhook each). Only titles
# and links are ever posted.
#
# How a source is read (kind = "auto", the default, tries these in order):
#   1. each URL in `feed` (RSS or Atom)
#   2. feeds advertised by the `site` page (<link rel="alternate">)
#   3. article links scraped from the `site` listing page
# So a wrong or moved feed URL degrades gracefully instead of breaking.
#
# Keys (all optional except id, name, category, and one of feed/site):
#   id               lowercase-with-dashes; also the key in the DISCORD_WEBHOOKS secret
#   name             shown in docs and digests
#   username         name the webhook posts as (defaults to name)
#   category         one of [categories] below
#   feed             URL or list of URLs tried in order
#   site             homepage or blog listing page (discovery + scraping fallback)
#   kind             "auto" | "feed" | "html"
#   link_pattern     regex for article URLs when scraping (rarely needed)
#   include_keywords only post titles containing one of these (case-insensitive)
#   exclude_keywords never post titles containing one of these
#   max_per_run      cap per run (default from [defaults])
#   max_age_days     dated items older than this are never posted
#   mode             "each" | "digest" | "auto"
#   enabled          false keeps the entry documented but inactive
#   high_volume      documentation flag for very busy feeds
#   author, note     documentation only
#
# After editing: `python -m feedbot lint` (CI runs it on every push and PR).
# =============================================================================

[defaults]
max_per_run = 5
max_age_days = 14
mode = "auto"
digest_over = 3
bootstrap_posts = 0
flood_threshold = 15
alert_after_failures = 3
stale_after_days = 365

[categories]
quantum-researchers = "Quantum researchers"
math = "Mathematics and math + AI"
tcs = "Theoretical computer science"
ai = "AI researchers"
big-tech = "Big tech quantum programs"
hardware = "Quantum hardware companies"
qec = "Quantum error correction"
software = "Quantum software and algorithms"
control = "Control systems and enabling hardware"
networking = "Quantum networking and post-quantum cryptography"
publications = "Professional bodies and publications"
government = "National labs and government programs"
institutes = "University institutes"
analysts = "Independent analysts and industry news"

