name: Publish website

# Rebuilds the newspaper site after every posting run and publishes it to
# GitHub Pages. Opt-in: set the repository variable SITE_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables) after choosing
# "GitHub Actions" as the Pages source (Settings > Pages). Until then this
# workflow is skipped, so it can never fail or send you failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest build matters; an older one still queued is dropped.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ vars.SITE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The posting run has just committed fresh state; build from the branch tip.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python -m feedbot site --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
